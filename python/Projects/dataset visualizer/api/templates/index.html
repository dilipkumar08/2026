<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Insights Copilot</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:700px;
            padding:40px;
            border-radius:18px;
            background:#1e293b;
            box-shadow:0 10px 40px rgba(0,0,0,.4);
        }

        h1{
            font-size:40px;
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            margin-bottom:30px;
            line-height:1.7;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
        }

        .box{
            background:#334155;
            padding:20px;
            border-radius:10px;
        }

        .box h3{
            margin-bottom:10px;
        }

        a{
            color:#38bdf8;
            text-decoration:none;
        }

        footer{
            margin-top:30px;
            color:#94a3b8;
            font-size:14px;
        }
    </style>
</head>

<body>

<div class="card">

<h1>📊 Data Insights Copilot</h1>

<p>
AI-powered analytics assistant built with
FastAPI, LangGraph, MCP, DuckDB, PostgreSQL (pgvector),
Ollama and Angular.
</p>

<div class="grid">

<div class="box">
<h3>Backend</h3>
<p>✅ Running</p>
</div>

<div class="box">
<h3>Swagger API</h3>
<a href="/docs">Open API Docs</a>
</div>

<div class="box">
<h3>Health Check</h3>
<a href="/health">/health</a>
</div>

<div class="box">
<h3>Frontend</h3>
<p>http://localhost:4200</p>
</div>

</div>

<footer>
Data Insights Copilot • MCP + LangGraph + Ollama
</footer>

</div>

</body>
</html>
